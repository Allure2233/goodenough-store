name: goodenough-store

services:
  postgres:
    image: postgres:16-alpine
    container_name: goodenough-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodenough
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - goodenough-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goodenough"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  goodenough-postgres-data:
